[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-sensing-tool"
version = "3.3.0"
description = "遥感解译助手 — Sentinel-2 / Landsat 多指数变化检测、地物分类、时序趋势与采样点生成"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# 上限为已验证过的主版本的下一个主版本
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "pandas>=2.0,<4",
    "rasterio>=1.3,<2",
    "fiona>=1.9,<2",
    "shapely>=2.0,<3",
    "pyproj>=3.5,<4",
    "opencv-python-headless>=4.8,<6",
    "matplotlib>=3.7,<4",
    "scikit-learn>=1.2,<2",
    "reportlab>=4.0,<6",
    "pystac-client>=0.7,<1",
    "planetary-computer>=1.0,<2",
    "requests>=2.28,<3",
]

[project.optional-dependencies]
web = [
    "streamlit>=1.58,<2",
    "folium>=0.15,<1",
    "streamlit-folium>=0.20,<1",
    "plotly>=5.18,<7",
]
dev = [
    "pytest>=7",
    "ruff>=0.6",
]

[project.scripts]
rs-change = "main:main"
rs-batch = "batch.batch_runner:batch_main"

[tool.setuptools]
py-modules = ["main", "config"]

[tool.setuptools.packages.find]
include = ["engine*", "services*", "batch*", "frontend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["data", "output", "tmp", "models"]

[tool.ruff.lint]
# 拦截运行时错误（未定义名、语法错误、重复定义等）与未使用的导入 / 变量；
# 风格类规则留给后续逐步收紧
select = ["F", "E9"]
ignore = [
    "E731",
]

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # web 依赖用于前端模块的导入测试（能力矩阵等）
      - name: Install
        run: pip install -e ".[web,dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (offline)
        run: pytest -q

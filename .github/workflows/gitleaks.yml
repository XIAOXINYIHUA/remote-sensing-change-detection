# CI 密钥扫描 —— 复制到用户仓库 .github/workflows/gitleaks.yml
# fetch-depth: 0 让 gitleaks 扫描全部历史
name: secret-scan
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

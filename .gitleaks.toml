# gitleaks 基础配置 —— 复制到用户仓库根目录（文件名 .gitleaks.toml）
# 作用：在 gitleaks 内置规则之上，接入本 skill 的人工审核基线文件

[extend]
useDefault = true

# 经人工复核的豁免项。patternTarget/path 按需追加，不要为通过扫描而放行真实密钥
[[allowlists]]
description = "reviewed false positives (safe-publish baseline)"
paths = [
  '''(^|/)\.safe-publish-baseline\.json$''',
]
